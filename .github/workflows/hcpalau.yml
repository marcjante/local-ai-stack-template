name: HC Palau

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/hcpalau/**"
      - ".github/workflows/hcpalau.yml"
  pull_request:
    paths:
      - "apps/hcpalau/**"
      - ".github/workflows/hcpalau.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hcpalau

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Validate a fresh Alembic database
        run: |
          db_path="$(mktemp -u /tmp/hcpalau-ci-XXXXXX.db)"
          HCPALAU_DATABASE_URL="sqlite:///$db_path" alembic upgrade head
          HCPALAU_DATABASE_URL="sqlite:///$db_path" alembic downgrade base
