{% extends "base.html" %}
{% block content %}
<div class="topbar"><h1>Playground</h1></div>

<div class="card">
  <h2 class="section-title" style="margin-top:0;">Proveedor y modelo</h2>
  <div style="display:flex; gap:10px; margin-bottom:14px;">
    <select id="provider" style="flex:1;"></select>
    <select id="model" style="flex:1;"></select>
  </div>

  <h2 class="section-title">System prompt</h2>
  <textarea id="systemPrompt" rows="2" placeholder="Opcional — instrucciones para el modelo"></textarea>

  <h2 class="section-title">Prompt</h2>
  <textarea id="prompt" rows="5" placeholder="Escribe tu pregunta o instrucción…"></textarea>

  <div style="display:flex; gap:20px; margin-top:14px; align-items:center; flex-wrap:wrap;">
    <label style="font-size:12px; color:var(--text-muted);">Temperature
      <input type="number" id="temperature" value="0.4" step="0.1" min="0" max="2" style="width:70px; margin-left:6px;">
    </label>
    <label style="font-size:12px; color:var(--text-muted);">Context
      <input type="number" id="numCtx" value="4096" step="512" style="width:90px; margin-left:6px;">
    </label>
    <button class="primary" id="runBtn" style="margin-left:auto;">RUN</button>
  </div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <h2 class="section-title" style="margin-top:0;">Answer</h2>
  <div id="answerText" style="white-space:pre-wrap; font-size:13.5px; line-height:1.6;"></div>
  <div id="answerStats" style="margin-top:14px; display:flex; gap:18px; color:var(--text-muted); font-size:12px;"></div>
</div>

<div class="card" id="errorCard" style="display:none; border-color:var(--red); color:var(--red);"></div>

<script>
async function loadProviders() {
  const res = await fetch('/api/playground/providers');
  const data = await res.json();
  const providerSel = document.getElementById('provider');
  const modelSel = document.getElementById('model');

  if (data.error) {
    providerSel.innerHTML = '<option>Gateway no disponible</option>';
    return;
  }

  providerSel.innerHTML = data.available.map(p => `<option value="${p}">${p}</option>`).join('');

  const routes = data.routes || {};
  const modelOptions = new Set();
  Object.values(routes).forEach(r => modelOptions.add(r.model));
  modelSel.innerHTML = [...modelOptions].map(m => `<option value="${m}">${m}</option>`).join('')
    || '<option value="">(sin modelos configurados)</option>';
}

document.getElementById('runBtn').addEventListener('click', async () => {
  const btn = document.getElementById('runBtn');
  const resultCard = document.getElementById('resultCard');
  const errorCard = document.getElementById('errorCard');
  errorCard.style.display = 'none';
  resultCard.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Running…';

  const body = {
    provider: document.getElementById('provider').value,
    model: document.getElementById('model').value,
    system: document.getElementById('systemPrompt').value || undefined,
    prompt: document.getElementById('prompt').value,
    temperature: parseFloat(document.getElementById('temperature').value),
    num_ctx: parseInt(document.getElementById('numCtx').value),
  };

  try {
    const res = await fetch('/api/playground/run', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      errorCard.textContent = data.error || 'Error desconocido';
      errorCard.style.display = 'block';
    } else {
      document.getElementById('answerText').textContent = data.response;
      const stats = [];
      if (data._elapsed_seconds != null) stats.push(`${data._elapsed_seconds} s`);
      if (data._tokens != null) stats.push(`${data._tokens} tokens`);
      if (data._tokens_per_second != null) stats.push(`${data._tokens_per_second} tok/s`);
      if (data._model_used) stats.push(`modelo: ${data._model_used}`);
      if (data._provider_used) stats.push(`proveedor: ${data._provider_used}`);
      document.getElementById('answerStats').textContent = stats.join('   ·   ');
      resultCard.style.display = 'block';
    }
  } catch (e) {
    errorCard.textContent = 'Fallo de red: ' + e;
    errorCard.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'RUN';
  }
});

loadProviders();
</script>
{% endblock %}
