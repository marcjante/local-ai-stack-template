<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Local AI Studio</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --text-muted: #8b949e;
    --accent: #3fb950; --accent-dim: #2ea043;
    --amber: #d29922; --red: #f85149; --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  nav.sidebar {
    width: 200px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); padding: 18px 0;
  }
  .brand { font-size: 14px; font-weight: 700; padding: 0 20px 18px; letter-spacing: 0.02em; }
  .brand .sub { display: block; font-size: 10px; color: var(--text-muted); font-weight: 400; margin-top: 2px; }
  nav.sidebar a {
    display: block; padding: 9px 20px; font-size: 13px; color: var(--text-muted);
    border-left: 2px solid transparent;
  }
  nav.sidebar a:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  nav.sidebar a.active { color: var(--text); border-left-color: var(--accent); background: rgba(63,185,80,0.08); }
  nav.sidebar a.disabled { color: #484f58; cursor: default; }

  main { flex: 1; padding: 24px 32px 60px; max-width: 1000px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .topbar h1 { font-size: 18px; margin: 0; }
  .health-badge { font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
  .health-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  h2.section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 26px 0 10px;
  }
  h2.section-title:first-of-type { margin-top: 0; }

  input, textarea, select, button {
    font-family: inherit; font-size: 13px; background: #0d1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
  }
  textarea { width: 100%; resize: vertical; }
  button { cursor: pointer; }
  button:hover { border-color: var(--blue); }
  button.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #05230c; font-weight: 700; }
  button.primary:hover { background: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.up { background: var(--accent); }
  .status-dot.down { background: var(--red); }
  .status-dot.unknown { background: #484f58; }
</style>
</head>
<body>
<nav class="sidebar">
  <div class="brand">LOCAL AI STUDIO<span class="sub">local-ai-stack-template</span></div>
  <a href="/" class="{{ 'active' if page == 'dashboard' }}">Dashboard</a>
  <a href="/playground" class="{{ 'active' if page == 'playground' }}">Playground</a>
  <a class="disabled" title="Próximamente">Models</a>
  <a href="/knowledge" class="{{ 'active' if page == 'knowledge' }}">Knowledge</a>
  <a href="/tasks-view" class="{{ 'active' if page == 'tasks' }}">Tasks</a>
  <a href="/plugins" class="{{ 'active' if page == 'plugins' }}">Plugins</a>
  <a href="/integrations" class="{{ 'active' if page == 'integrations' }}">Integrations</a>
  <a href="/logs-view" class="{{ 'active' if page == 'logs' }}">Logs</a>
  <a href="/evaluation" class="{{ 'active' if page == 'evaluation' }}">Evaluation</a>
  <a href="/settings" class="{{ 'active' if page == 'settings' }}">Settings</a>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
