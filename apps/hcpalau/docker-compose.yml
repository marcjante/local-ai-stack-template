services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hcpalau
      POSTGRES_USER: hcpalau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - hcpalau-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcpalau -d hcpalau"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg2://hcpalau:${POSTGRES_PASSWORD}@db:5432/hcpalau
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "${PORT:-8000}:8000"
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port $${PORT}"

volumes:
  hcpalau-pgdata:
