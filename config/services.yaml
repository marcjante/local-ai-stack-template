# services.yaml
# Inventario de servicios del stack local.
# Cada proyecto que use esta plantilla debe adaptar nombres, puertos y comandos,
# pero mantener esta estructura para que el dashboard y los scripts funcionen sin cambios.
#
# El orden de la lista importa: start_stack.sh arranca de arriba a abajo,
# stop_stack.sh para de abajo a arriba. Coloca cada servicio después de
# aquello de lo que depende (depends_on).
#
# health_endpoint: ruta HTTP que el dashboard comprueba con un GET real
# (no solo si el puerto está abierto). Déjalo en null para servicios que
# no hablan HTTP (Redis, Postgres, o los workers de RQ, que son procesos
# sin servidor HTTP propio — su salud se ve indirectamente por la
# profundidad de sus colas en el panel).

services:

  - id: llm
    name: "Motor LLM local (Ollama)"
    description: "Sirve los modelos de lenguaje. Nadie debería llamarlo directamente salvo llm_gateway."
    host: 127.0.0.1
    port: 11434
    health_endpoint: "/api/tags"
    start_command: "ollama serve"
    stop_command: "pkill -f 'ollama serve'"
    docker_service: null
    depends_on: []

  - id: llm_gateway
    name: "LLM Gateway"
    description: "Único punto de acceso al LLM: limita cuántas llamadas concurrentes lo saturan."
    host: 127.0.0.1
    port: 8091
    health_endpoint: "/health"
    start_command: "python3 llm_gateway/llm_gateway.py"
    stop_command: "pkill -f 'llm_gateway.py'"
    docker_service: "llm_gateway"
    depends_on: [llm]

  - id: vector_db
    name: "Base de datos vectorial (ChromaDB)"
    description: "Almacena embeddings para búsqueda semántica (RAG)."
    host: 127.0.0.1
    port: 8000
    health_endpoint: "/api/v1/heartbeat"
    start_command: "chroma run --path ./data/chroma --port 8000"
    stop_command: "pkill -f 'chroma run'"
    docker_service: null
    depends_on: []

  - id: queue
    name: "Cola de tareas (Redis)"
    description: "Backend de RQ: encola tareas, gestiona reintentos, backoff y jobs fallidos."
    host: 127.0.0.1
    port: 6379
    health_endpoint: null
    start_command: "redis-server --port 6379"
    stop_command: "redis-cli -p 6379 shutdown"
    docker_service: "redis"
    depends_on: []

  - id: database
    name: "Base de datos (Postgres)"
    description: "Persistencia de tareas con estado (pending/running/completed/failed) y resultados."
    host: 127.0.0.1
    port: 5432
    health_endpoint: null
    start_command: "pg_ctl -D ./data/pgdata -l ./data/pg.log start"
    stop_command: "pg_ctl -D ./data/pgdata stop"
    docker_service: "postgres"
    depends_on: []

  - id: backend_api
    name: "Backend API"
    description: "Autentica (API key), encola tareas en la cola especializada correcta y expone estado (SSE incluido)."
    host: 127.0.0.1
    port: 8080
    health_endpoint: "/health"
    start_command: "python3 backend/main.py"
    stop_command: "pkill -f 'backend/main.py'"
    docker_service: "backend"
    depends_on: [llm_gateway, vector_db, queue, database]

  - id: automation
    name: "Automatización (n8n)"
    description: "Flujos de automatización: backups, tareas programadas, integraciones."
    host: 127.0.0.1
    port: 5678
    health_endpoint: "/healthz"
    start_command: "n8n start"
    stop_command: "pkill -f 'n8n start'"
    docker_service: null
    depends_on: []

  - id: worker_fetch
    name: "Worker: fetch"
    description: "Especializado en traer datos externos (APIs, ficheros). Cola 'fetch', con reintento+backoff."
    host: 127.0.0.1
    port: null
    health_endpoint: null
    start_command: "rq worker fetch --url redis://127.0.0.1:6379/0"
    stop_command: "pkill -f 'rq worker fetch'"
    docker_service: "worker_fetch"
    depends_on: [queue, database]

  - id: worker_process
    name: "Worker: process"
    description: "Especializado en trabajo pesado (llama a llm_gateway, nunca a Ollama directo). Cola 'process'."
    host: 127.0.0.1
    port: null
    health_endpoint: null
    start_command: "rq worker process --url redis://127.0.0.1:6379/0"
    stop_command: "pkill -f 'rq worker process'"
    docker_service: "worker_process"
    depends_on: [queue, database, llm_gateway]

  - id: worker_notify
    name: "Worker: notify"
    description: "Especializado en avisar cuando algo termina (webhook, SSE). Cola 'notify', timeout corto."
    host: 127.0.0.1
    port: null
    health_endpoint: null
    start_command: "rq worker notify --url redis://127.0.0.1:6379/0"
    stop_command: "pkill -f 'rq worker notify'"
    docker_service: "worker_notify"
    depends_on: [queue, database]

  - id: dashboard
    name: "Panel de control"
    description: "Comprueba salud real (HTTP) de cada servicio, muestra CPU/RAM y profundidad de colas."
    host: 127.0.0.1
    port: 8090
    health_endpoint: "/"
    start_command: "python3 dashboard/dashboard_service.py"
    stop_command: "pkill -f 'dashboard_service.py'"
    docker_service: "dashboard"
    depends_on: [backend_api]

  - id: proxy
    name: "Reverse proxy (Nginx)"
    description: "Punto de entrada único: reparte tráfico hacia dashboard/backend en vez de exponer cada puerto suelto."
    host: 127.0.0.1
    port: 80
    health_endpoint: "/"
    start_command: "nginx -c $(pwd)/config/nginx.conf"
    stop_command: "nginx -s stop"
    docker_service: null
    depends_on: [dashboard, backend_api]
