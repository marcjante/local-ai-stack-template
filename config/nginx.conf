# nginx.conf
# Reverse proxy mínimo: expone todo el stack en el puerto 80, repartiendo
# por ruta hacia el panel de control y el backend. Ajusta las rutas/puertos
# si cambias services.yaml.

events {}

http {
  server {
    listen 80;

    # Panel de control en la raíz
    location / {
      proxy_pass http://127.0.0.1:8090;
      proxy_set_header Host $host;
    }

    # API del backend bajo /api/
    location /api/ {
      proxy_pass http://127.0.0.1:8080/;
      proxy_set_header Host $host;
    }
  }
}
