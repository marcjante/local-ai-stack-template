# Local AI Studio - Tool Registry
#
# Lista blanca de capacidades reales autorizadas.
#
# Skills = conocimiento y contexto metodológico.
# Tools  = acciones reales implementadas por plugins/workers.
#
# La existencia de un plugin NO lo autoriza automáticamente como Tool.
# Una Skill externa tampoco puede concederse permisos de Tool.
#
# Permisos:
# - agent_callable:
#     La Tool puede ser propuesta/invocada por una capa agente autorizada.
# - requires_confirmation_before_execute:
#     Requiere confirmación humana antes de ejecutar la acción.
# - human_review_required:
#     El resultado generado requiere revisión humana antes de considerarse
#     una decisión científica definitiva.
# - effect:
#     Tipo principal de efecto: draft, read, write o read_write.

version: 2

tools:

  - id: protocol_designer
    name: "Protocol Designer"
    description: "Genera una propuesta estructurada de protocolo de investigación."
    queue: protocol_designer
    enabled: true
    agent_callable: true
    requires_confirmation_before_execute: false
    human_review_required: true
    effect: draft
    category: systematic_review
    tasks:
      - protocol_design

  - id: search_strategy_designer
    name: "Search Strategy Designer"
    description: "Diseña y valida estrategias de búsqueda bibliográfica sin importar resultados automáticamente."
    queue: search_strategy_designer
    enabled: true
    agent_callable: true
    requires_confirmation_before_execute: false
    human_review_required: true
    effect: draft
    category: systematic_review
    tasks:
      - search_strategy

  - id: pubmed_search
    name: "PubMed Search"
    description: "Ejecuta búsquedas reales en PubMed mediante NCBI E-utilities y puede importar resultados en una revisión."
    queue: pubmed_search
    enabled: true
    agent_callable: true
    requires_confirmation_before_execute: true
    human_review_required: false
    effect: read_write
    category: systematic_review
    tasks:
      - literature_search
      - pubmed_search

  - id: screening
    name: "AI Screening"
    description: "Genera y registra propuestas de cribado por título y resumen sin sustituir la decisión humana."
    queue: screening
    enabled: true
    agent_callable: true
    requires_confirmation_before_execute: true
    human_review_required: true
    effect: write
    category: systematic_review
    tasks:
      - screening

  - id: human_screening
    name: "Human Screening"
    description: "Registra una decisión humana explícita de cribado y el motivo de exclusión cuando corresponde."
    queue: human_screening
    enabled: true
    agent_callable: false
    requires_confirmation_before_execute: true
    human_review_required: false
    effect: write
    category: systematic_review
    tasks:
      - human_screening

  - id: process
    name: "Verified RAG Process"
    description: "Procesa una consulta mediante contexto documental, LLM Gateway, verificación de fuentes y auditoría."
    queue: process
    enabled: true
    agent_callable: true
    requires_confirmation_before_execute: false
    human_review_required: false
    effect: read
    category: general
    tasks:
      - rag_query
      - evidence_answer
